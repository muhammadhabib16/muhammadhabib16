<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    
    <clipPath id="type-cmd1">
      <rect x="0" y="50" width="0" height="30">
        <animate attributeName="width" from="0" to="800" begin="0.5s" dur="0.8s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="type-cmd2">
      <rect x="0" y="230" width="0" height="30">
        <animate attributeName="width" from="0" to="800" begin="2.5s" dur="1s" fill="freeze" />
      </rect>
    </clipPath>

   
    <clipPath id="show-out1">
      <rect x="0" y="80" width="800" height="0">
        <animate attributeName="height" from="0" to="140" begin="1.5s" dur="0.1s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="show-out2">
      <rect x="0" y="260" width="800" height="0">
        <animate attributeName="height" from="0" to="80" begin="3.7s" dur="0.1s" fill="freeze" />
      </rect>
    </clipPath>

  
    <clipPath id="show-cursor">
      <rect x="0" y="350" width="0" height="30">
        <animate attributeName="width" from="0" to="800" begin="4.2s" dur="0.1s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .term-bg { fill: #0D1117; }
    .term-bar { fill: #161B22; }
    .text-main { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #C9D1D9; }
    .text-prompt { fill: #00FF41; font-weight: bold; font-size: 15px; }
    .text-accent { fill: #7AA2F7; font-weight: bold; }
    .text-title { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #8B949E; }
  </style>

  
  <rect width="100%" height="100%" class="term-bg" rx="10" />

  <rect width="100%" height="30" class="term-bar" rx="10" />
  <rect width="100%" height="15" y="15" class="term-bar" /> 
  <circle cx="20" cy="15" r="6" fill="#FF5F56" />
  <circle cx="40" cy="15" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="15" r="6" fill="#27C93F" />
  <text x="400" y="20" class="text-title" text-anchor="middle">bash - root@homelab:~</text>

  <g class="text-main">
    <!-- Sesi 1: whoami -->
    <g clip-path="url(#type-cmd1)">
      <text x="20" y="70" class="text-prompt">>_ whoami</text>
    </g>
    <g clip-path="url(#show-out1)">
      <text x="20" y="100">I am an Information Systems student and Lab Teaching Assistant at Universitas</text>
      <text x="20" y="120">Andalas with a strong drive for software engineering and system architecture.</text>
      <text x="20" y="140">Beyond writing code for full-stack web and mobile apps, my playground involves</text>
      <text x="20" y="160">configuring Linux homelab servers, automating CI/CD pipelines, and exploring</text>
      <text x="20" y="180">the intersection of AI and cloud computing. I thrive in collaborative tech</text>
      <text x="20" y="200">environments like <tspan class="text-accent">UKM Neo Telemetri</tspan>, building scalable solutions.</text>
    </g>

    <!-- Sesi 2: current_directives -->
    <g clip-path="url(#type-cmd2)">
      <text x="20" y="250" class="text-prompt">>_ current_directives</text>
    </g>
    <g clip-path="url(#show-out2)">
      <text x="20" y="280">- Exploring Advanced System Architecture, CI/CD, and AI Machine Learning.</text>
      <text x="20" y="300">- Assisting in practical sessions at the Laboratory Of Systems Development.</text>
      <text x="20" y="320">- Expanding expertise in Cloud Computing, Mobile Programming &amp; DevOps.</text>
    </g>

    <g clip-path="url(#show-cursor)">
      <text x="20" y="370" class="text-prompt">root@homelab:~$ <tspan fill="#C9D1D9">█</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </text>
    </g>
  </g>
</svg>

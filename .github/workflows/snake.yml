name: Generate Snake Animation

on:
  # Berjalan otomatis setiap tengah malam (jam 00:00)
  schedule:
    - cron: "0 0 * * *" 
  
  # Mengizinkan kamu menjalankan script ini secara manual dari tab Actions
  workflow_dispatch:
  
  # Berjalan setiap kali ada perubahan yang di-push ke branch utama
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Langkah 1: Generate animasi SVG berdasarkan grafik kontribusi
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Langkah 2: Push hasil gambar ke branch khusus
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

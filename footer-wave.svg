<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="gradMatrix1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" />
      <stop offset="50%" stop-color="#008F11" />
      <stop offset="100%" stop-color="#7AA2F7" />
    </linearGradient>
    
    <linearGradient id="gradMatrix2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7" />
      <stop offset="50%" stop-color="#003B00" />
      <stop offset="100%" stop-color="#00FF41" />
    </linearGradient>

    <path id="fluid1" stroke-linecap="round">
      <animate attributeName="d" 
        values="
          M 0 0 C 200 -120, 200 120, 400 0 C 600 -120, 600 120, 800 0 C 1000 -120, 1000 120, 1200 0 C 1400 -120, 1400 120, 1600 0;
          M 0 0 C 150 100, 300 -140, 400 0 C 550 100, 700 -140, 800 0 C 950 100, 1100 -140, 1200 0 C 1350 100, 1500 -140, 1600 0;
          M 0 0 C 250 -150, 150 100, 400 0 C 650 -150, 550 100, 800 0 C 1050 -150, 950 100, 1200 0 C 1450 -150, 1350 100, 1600 0;
          M 0 0 C 200 -120, 200 120, 400 0 C 600 -120, 600 120, 800 0 C 1000 -120, 1000 120, 1200 0 C 1400 -120, 1400 120, 1600 0" 
        dur="6s" repeatCount="indefinite" />
    </path>

    <path id="fluid2" stroke-linecap="round">
      <animate attributeName="d" 
        values="
          M 0 0 C 200 120, 200 -120, 400 0 C 600 120, 600 -120, 800 0 C 1000 120, 1000 -120, 1200 0 C 1400 120, 1400 -120, 1600 0;
          M 0 0 C 250 -100, 150 140, 400 0 C 650 -100, 550 140, 800 0 C 1050 -100, 950 140, 1200 0 C 1450 -100, 1350 140, 1600 0;
          M 0 0 C 150 150, 300 -100, 400 0 C 550 150, 700 -100, 800 0 C 950 150, 1100 -100, 1200 0 C 1350 150, 1500 -100, 1600 0;
          M 0 0 C 200 120, 200 -120, 400 0 C 600 120, 600 -120, 800 0 C 1000 120, 1000 -120, 1200 0 C 1400 120, 1400 -120, 1600 0" 
        dur="7s" repeatCount="indefinite" />
    </path>
  </defs>

  <rect width="100%" height="100%" fill="#0D1117" />

  <g transform="translate(0, 100)">
    <g stroke="url(#gradMatrix1)" fill="none">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="12s" repeatCount="indefinite" />
      <use href="#fluid1" transform="scale(1, 1.5)" stroke-width="0.3" opacity="0.3" />
      <use href="#fluid1" transform="scale(1, 1.25)" stroke-width="0.5" opacity="0.5" />
      <use href="#fluid1" transform="scale(1, 1.0)" stroke-width="0.8" opacity="0.7" />
      <use href="#fluid1" transform="scale(1, 0.75)" stroke-width="1.2" opacity="1.0" />
      <use href="#fluid1" transform="scale(1, 0.5)" stroke-width="0.8" opacity="0.7" />
      <use href="#fluid1" transform="scale(1, 0.25)" stroke-width="0.5" opacity="0.4" />
    </g>
  </g>

  <g transform="translate(0, 100)">
    <g stroke="url(#gradMatrix2)" fill="none">
      <animateTransform attributeName="transform" type="translate" from="-800 0" to="0 0" dur="14s" repeatCount="indefinite" />
      <use href="#fluid2" transform="scale(1, 1.4)" stroke-width="0.3" opacity="0.2" />
      <use href="#fluid2" transform="scale(1, 1.15)" stroke-width="0.5" opacity="0.4" />
      <use href="#fluid2" transform="scale(1, 0.9)" stroke-width="0.8" opacity="0.6" />
      <use href="#fluid2" transform="scale(1, 0.65)" stroke-width="1.2" opacity="0.9" />
      <use href="#fluid2" transform="scale(1, 0.4)" stroke-width="0.8" opacity="0.5" />
      <use href="#fluid2" transform="scale(1, 0.15)" stroke-width="0.4" opacity="0.3" />
    </g>
  </g>
</svg>
